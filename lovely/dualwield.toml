[manifest]
version = "1.0.0"
dump_lua = true
priority = 1

# Insert alt blind function into start_run
[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = '''reset_blinds()'''
position = 'after'
match_indent = true
payload = '''OPAL.reset_alt_blinds()'''

# Have alt blind reset follow blind reset
[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = '''SMODS.reset_blind_choices(G.GAME.round_resets.blind_choices)'''
position = 'after'
match_indent = true
payload = '''OPAL.reset_alt_blinds()'''

# Add alt blind to UI
[[patches]]
[patches.pattern]
target = 'functions/UI_definitions.lua'
pattern = '''G.GAME.round_resets.blind_ante = G.GAME.round_resets.blind_ante or G.GAME.round_resets.ante'''
position = 'before'
match_indent = true
payload = '''if G.GAME.round_resets.alt_blind_choices[type] then extras = {n=G.UIT.C, config = {}, nodes = {create_UIBox_opal_alt_blind(type, run_info), extras}} end'''

# Generate alt blinds at start of run
[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = '''self.GAME.round_resets.blind_choices.Boss = get_new_boss()'''
position = 'after'
match_indent = true
payload = '''G.GAME.modifiers.opal_alt_blinds = G.GAME.modifiers.opal_alt_blinds or {}'''

# Add alt_blind_choices to starting stuff
[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = '''blind_choices = {Small = 'bl_small', Big = 'bl_big'},'''
position = 'after'
match_indent = true
payload = '''alt_blind_choices = {},'''

# Tell handler where to find alt blind button.
[[patches]]
[patches.pattern]
target = 'functions/button_callbacks.lua'
pattern = '''local _blind_choice = G.blind_select_opts[string.lower(e.config.id)]
          local _top_button = e.UIBox:get_UIE_by_ID('select_blind_button')'''
position = 'after'
match_indent = true
payload = '''local _alt_blind_button = e.UIBox:get_UIE_by_ID('select_alt_blind_button')'''

# Change alt blind button when blind is on deck
[[patches]]
[patches.pattern]
target = 'functions/button_callbacks.lua'
pattern = '''_top_button.children[1].config.colour = G.C.WHITE
            end'''
position = 'after'
match_indent = true
payload = '''if _alt_blind_button then
    _alt_blind_button.config.button = 'select_blind'
    _alt_blind_button.config.colour = G.C.FILTER
    _alt_blind_button.config.hover = true
    _alt_blind_button.children[1].config.colour = G.C.WHITE
end'''

# Change ab button when blind is not on deck.
[[patches]]
[patches.pattern]
target = 'functions/button_callbacks.lua'
pattern = '''_top_button.children[1].config.colour = G.C.UI.TEXT_INACTIVE
            end'''
position = 'after'
match_indent = true
payload = '''if _alt_blind_button then
    _alt_blind_button.config.button = nil
    _alt_blind_button.config.colour = G.C.UI.BACKGROUND_INACTIVE
    _alt_blind_button.config.hover = false
    _alt_blind_button.children[1].config.colour = G.C.UI.TEXT_INACTIVE
end'''

# Compress blind info when alt blinds are present
[[patches]]
[patches.pattern]
target = 'functions/UI_definitions.lua'
pattern = '''{n=G.UIT.R, config={align = "cm", colour = mix_colours(G.C.BLACK, G.C.L_BLACK, 0.5), r = 0.1, outline = 1, outline_colour = G.C.L_BLACK}, nodes={'''
position = 'before'
match_indent = true
payload = '''G.GAME.round_resets.alt_blind_choices[type] and {n=G.UIT.R, config={align = "cm", colour = mix_colours(G.C.BLACK, G.C.L_BLACK, 0.5), r = 0.1, outline = 1, outline_colour = G.C.L_BLACK}, nodes={  
            {n=G.UIT.R, config={align = "cm", padding = 0.1}, nodes={
                not run_info and {n=G.UIT.R, config={id = 'select_blind_button', align = "cm", ref_table = blind_choice.config, colour = disabled and G.C.UI.BACKGROUND_INACTIVE or G.C.ORANGE, minh = 0.6, minw = 2.7, padding = 0.07, r = 0.1, shadow = true, hover = true, one_press = true, button = 'select_blind'}, nodes={
                    {n=G.UIT.T, config={ref_table = G.GAME.round_resets.loc_blind_states, ref_value = type, scale = 0.45, colour = disabled and G.C.UI.TEXT_INACTIVE or G.C.UI.TEXT_LIGHT, shadow = not disabled}}
                }} or 
                {n=G.UIT.R, config={id = 'select_blind_button', align = "cm", ref_table = blind_choice.config, colour = run_info_colour, minh = 0.6, minw = 2.7, padding = 0.07, r = 0.1, emboss = 0.08}, nodes={
                    {n=G.UIT.T, config={text = localize(blind_state, 'blind_states'), scale = 0.45, colour = G.C.UI.TEXT_LIGHT, shadow = true}}
                }}
            }},
            {n=G.UIT.R, config={align = "cm", padding = 0.05}, nodes={
                {n=G.UIT.R, config={id = 'blind_desc', align = "cm", padding = 0.05}, nodes={
                    {n=G.UIT.C, config={align = "cm"}, nodes={
                        {n=G.UIT.R, config={align = "cm", minh = 1.2}, nodes={
                            {n=G.UIT.O, config={object = card}},
                        }},
                    }},
                    {n=G.UIT.C, config={align = "cm",r = 0.1, padding = 0.05, minw = 1.5, colour = G.C.BLACK, emboss = 0.05}, nodes={
                        {n=G.UIT.R, config={align = "cm", minh = 0.6}, nodes={
                            {n=G.UIT.O, config={w=0.3,h=0.3, colour = G.C.BLUE, object = stake_sprite, hover = true, can_collide = false}},
                            {n=G.UIT.B, config={h=0.1,w=0.1}},
                            {n=G.UIT.T, config={text = number_format(blind_amt), scale = score_number_scale(0.7, blind_amt), colour = disabled and G.C.UI.TEXT_INACTIVE or G.C.RED, shadow =  not disabled}}
                        }},
                        _reward and {n=G.UIT.R, config={align = "cm"}, nodes={
                            {n=G.UIT.T, config={text = blind_choice.config.dollars < 6 and (string.rep(localize("$"), blind_choice.config.dollars)..'+') or (localize("$")..blind_choice.config.dollars..'+'), scale = 0.35, colour = disabled and G.C.UI.TEXT_INACTIVE or G.C.MONEY, shadow = not disabled}}
                        }} or nil,
                    }},
                }},
            }},
        }} or'''

# 2/
[[patches]]
[patches.pattern]
target = 'functions/UI_definitions.lua'
pattern = '''local loc_name = localize{type = 'name_text', key = target.key or blind_choice.config.key, set = target.set or 'Blind'}
  local text_table = G.localization.descriptions[target.set][target.key].text_parsed'''
position = 'before'
match_indent = true
payload = '''local card = G.GAME.round_resets.alt_blind_choices[type] and Card(0, 0, 1.4, 1.4, G.P_CARDS.empty, G.P_CENTERS.c_base) or nil
if card then
card.children.center = blind_choice.animation
blind_choice.animation:set_role({major = card, role_type = 'Minor', draw_major = card, xy_bond = 'Weak'})
card.states.drag.can = true
card.hover = function()
	if not G.CONTROLLER.dragging.target or G.CONTROLLER.using_touch then
		if not card.hovering and card.states.visible then
			card.config.h_popup = create_UIBox_blind_popup(blind_choice.config, true)
			card.config.h_popup_config = card:align_h_popup()
			Node.hover(card)
		end
	end
	card.stop_hover = function()
		card.hovering = false; Node.stop_hover(card)
	end
end
end'''

# Wrap around this if statement to stop alternative blinds from scaling ante
[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = '''G.GAME.voucher_restock = nil'''
position = 'before'
match_indent = true
payload = '''if G.GAME.round_resets.blind_states.Boss == 'Current' then'''

# 2/
[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = '''delay(0.4); SMODS.ante_end = true; ease_ante(1); SMODS.ante_end = nil; delay(0.4); check_for_unlock({type = 'ante_up', ante = G.GAME.round_resets.ante + 1})'''
position = 'after'
match_indent = true
payload = '''end'''

# test
[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = """if G.GAME.round_resets.blind_states.Small == 'Current' then
                G.GAME.round_resets.blind_states.Small = 'Current'"""
position = 'before'
match_indent = true
payload = '''G.GAME.in_alt_blind = nil
for k, v in pairs(G.GAME.round_resets.alt_blind_choices) do
    if G.GAME.round_resets.blind == G.P_BLINDS[v] then
        G.GAME.in_alt_blind = k
    end
end
if not G.GAME.in_alt_blind then'''

# test
[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = """blhash = 'L'"""
position = 'after'
match_indent = true
payload = '''end
else
    if G.GAME.round_resets.blind == G.P_BLINDS[G.GAME.round_resets.alt_blind_choices.Small] then
        blhash = 'S'
    elseif G.GAME.round_resets.blind == G.P_BLINDS[G.GAME.round_resets.alt_blind_choices.Big] then
        blhash = 'B'
    else
        blhash = 'L'
    end'''

# WAITER MORE PATCHES TO STATE_EVENTS PLEASE
[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = """if G.GAME.round_resets.blind_states.Small == 'Current' then
                            G.GAME.round_resets.blind_states.Small = 'Defeated'"""
position = 'before'
match_indent = true
payload = '''if not G.GAME.in_alt_blind then'''

# 
[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = """v.ability.played_this_ante = nil
                            end
                        end"""
position = 'after'
match_indent = true
payload = '''else
    G.GAME.round_resets.blind_states[G.GAME.in_alt_blind] = 'Defeated'
end'''

# Stop alt blinds from having boss = true
[[patches]]
[patches.pattern]
target = 'blind.lua'
pattern = """G.ARGS.spin.real = (G.SETTINGS.reduced_motion and 0 or 1)*(self.config.blind.boss and (self.config.blind.boss.showdown and 0.5 or 0.25) or 0)"""
position = 'after'
match_indent = true
payload = '''if G.GAME.in_alt_blind and not G.GAME.round_resets.blind_states.Boss == "Current" then self.boss = false end'''

# HI NOTMARIO :D
[[patches]]
[patches.pattern]
target = '=[SMODS MoreFluff "other/superboss.lua"]'
pattern = '''G.GAME.round_resets.blind_choices.Boss = G.get_new_superboss()'''
position = 'after'
match_indent = true
payload = '''if G.GAME.round_resets.alt_blind_choices.Big then G.GAME.round_resets.alt_blind_choices.Big = get_new_boss() end
if G.GAME.round_resets.alt_blind_choices.Big then G.GAME.round_resets.alt_blind_choices.Boss = G.get_new_superboss() end'''

# Fix blind UI with the new Smods stuff
[[patches]]
[patches.pattern]
target = """=[SMODS _ "src/ui.lua"]"""
position = 'at'
pattern = '''box.nodes[1].nodes[3].config.padding = 0.1'''
payload = '''if not G.GAME.round_resets.alt_blind_choices[type] then
    box.nodes[1].nodes[3].config.padding = 0.1
end'''
match_indent = true